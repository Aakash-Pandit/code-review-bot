name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: code_review_bot
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: code_review_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U code_review_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://code_review_bot:changeme@localhost:5432/code_review_bot_test
      TEST_DATABASE_URL: postgresql://code_review_bot:changeme@localhost:5432/code_review_bot_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing
