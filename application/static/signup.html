<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Code Review Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .row { display: flex; gap: 0.75rem; }
    .row .field { flex: 1; }
    .field { margin-bottom: 1rem; }

    label {
      font-size: 0.8rem;
      color: #8b949e;
      display: block;
      margin-bottom: 0.3rem;
    }

    input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #58a6ff; }

    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    .error {
      color: #f85149;
      font-size: 0.8rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1.2em;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: #8b949e;
    }

    .footer a { color: #58a6ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create an account</h1>
    <div class="row">
      <div class="field">
        <label for="first_name">First name</label>
        <input id="first_name" type="text" placeholder="Jane" autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="last_name">Last name</label>
        <input id="last_name" type="text" placeholder="Doe" autocomplete="family-name" />
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" />
    </div>
    <button id="btn" onclick="doSignup()">Create account</button>
    <div class="error" id="error"></div>
    <div class="footer">Already have an account? <a href="/login">Log in</a></div>
  </div>

  <script>
    if (localStorage.getItem("token")) window.location.href = "/";

    async function doSignup() {
      const first_name = document.getElementById("first_name").value.trim();
      const last_name = document.getElementById("last_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btn");
      const errorEl = document.getElementById("error");

      errorEl.textContent = "";
      if (!first_name || !last_name || !email || !password) {
        errorEl.textContent = "All fields are required.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account…";

      try {
        const res = await fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ first_name, last_name, email, password }),
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.detail || "Signup failed."; return; }
        window.location.href = "/login";
      } catch (err) {
        errorEl.textContent = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    }
  </script>
</body>
</html>
